{% extends "base.html" %}
{% set role = 'public' %}{% set active = 'login' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="card"><h3>Login</h3><form id="auth-form"><label>Email *<input id="email" name="email" type="email" required autocomplete="email"></label><label>Password *<input id="password" name="password" type="password" required autocomplete="current-password"></label><p class="err" id="form-error" role="alert"></p><button type="submit" class="p">Login</button></form><p><button type="button" disabled>Aadhaar Login — Future Integration</button></p><p><small>New here? <a href="/register">Create a citizen account</a></small></p></div></section>
{% endblock %}
