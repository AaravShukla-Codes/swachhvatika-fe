{% extends "base.html" %}
{% set role = 'worker' %}{% set active = 'tasks' %}
{% block title %}Assigned Tasks{% endblock %}
{% block content %}
<h2>Assigned Tasks</h2><div class="act" id="task-filters" role="group" aria-label="Filter tasks"><button type="button" data-filter="">All</button><button type="button" data-filter="ASSIGNED">Assigned</button><button type="button" data-filter="ACCEPTED">Accepted</button><button type="button" data-filter="IN_PROGRESS">In Progress</button><button type="button" data-filter="COMPLETED">Completed</button></div><div class="stack" id="tasks-list"></div><div class="card empty" id="tasks-loading" data-state="loading"><span class="spin" aria-hidden="true"></span><p>Loading…</p></div><div class="card empty" id="tasks-empty" data-state="empty" hidden><span class="ic">🌿</span><p>No tasks assigned.</p></div><div class="card empty" id="tasks-error" data-state="error" hidden><p>Unable to load. Please try again.</p><button type="button" data-action="retry">Retry</button></div><nav class="pager" id="tasks-pager" aria-label="Pagination"><button type="button" data-page="prev">Previous</button><span data-page-info>Page 1</span><button type="button" data-page="next">Next</button></nav><template id="task-card-template"><div class="card stop"><div class="sn" data-field="index"></div><div class="sb"><div class="ch"><b data-field="id"></b><span class="tag" data-field="status"></span></div><p data-field="type"></p><p>📍 <span data-field="location"></span></p><small data-field="assigned_at"></small><div class="act"><a class="btn p" data-field="link">View</a></div></div></div></template>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/worker/tasks.js') }}" defer></script>{% endblock %}
