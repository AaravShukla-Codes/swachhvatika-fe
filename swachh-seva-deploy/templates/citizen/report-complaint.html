{% extends "base.html" %}
{% set role = 'citizen' %}{% set active = 'report' %}
{% block title %}Report Waste{% endblock %}
{% block content %}
<h2>Report Waste</h2><p class="sub">Add details, a photo and the location.</p><form class="card" id="complaint-form" enctype="multipart/form-data"><label>Category *<select id="category" name="category" required><option value="">Select category</option><option value="GARBAGE_DUMP">Garbage Dump</option><option value="OVERFLOWING_BIN">Overflowing Bin</option><option value="PLASTIC_WASTE">Plastic Waste</option><option value="CONSTRUCTION_WASTE">Construction Waste</option><option value="DRAIN_WASTE">Drain Waste</option><option value="OPEN_DUMPING">Open Dumping</option><option value="DEAD_ANIMAL">Dead Animal</option><option value="OTHER">Other</option></select></label><label>Description *<textarea id="description" name="description" rows="3" required></textarea></label><div class="card b"><h3>Location</h3><button type="button" id="use-location" data-action="use-location">📍 Use My Location</button><p class="err" id="location-msg" role="alert"></p><label>Latitude<input id="latitude" name="latitude" type="number" step="any" min="-90" max="90"></label><label>Longitude<input id="longitude" name="longitude" type="number" step="any" min="-180" max="180"></label><label>Address<textarea id="address" name="address" rows="2"></textarea></label></div><label class="drop">📷 Photo (JPG, PNG or WEBP)<input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><img class="thumb" id="image-preview" alt="Preview" hidden><p class="err" id="form-error" role="alert"></p><button type="submit" class="p cta" id="submit-btn">Submit <em>→</em></button></form><div class="card" id="submit-result" hidden><p>Complaint ID: <b data-field="id">—</b></p><a class="btn p" id="view-complaint" href="#">Track status</a></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/citizen/report-complaint.js') }}" defer></script>{% endblock %}
