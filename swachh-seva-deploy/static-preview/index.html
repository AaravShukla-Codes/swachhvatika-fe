<div class="bento"><div class="card s6"><h3>Status overview</h3><div class="cols">${['Submitted','Verified','Assigned','Dispatched','Resolved'].map((x,i)=>`<div><i style="height:${n(i)/sm*78}%"><b>${n(i)}</b></i><small>${x}</small></div>`).join('')}</div></div>
<div class="card s6"><h3>Waste categories</h3>${Object.entries(cat).map(([k,v])=>`<small>${k} (${v})</small><div class="bar" style="margin-bottom:8px"><i style="width:${v/mx*100}%"></i></div>`).join('')||'<p class="empty">No data.</p>'}<p><small>Collector activity — Scheduled: ${pc('Scheduled')} · QR Verified: ${pc('QR Verified')} · Completed: ${pc('Completed')}</small></p></div>
<div class="card s6"><h3>Pickup requests</h3>${D.picks.slice(0,6).map(p=>`<div class="row"><span>${p.id} · ${p.type} · ${p.loc}</span><span class="tag">${p.st}</span></div>`).join('')||'<p class="empty">None yet.</p>'}</div>
<div class="card s6"><h3>Recent complaints</h3>${c.slice(0,6).map(x=>`<div class="row"><span>${x.id} · ${x.type}<br><small>${ST[x.s]}</small></span>${x.s<4?`<button onclick="adv('${x.id}')">Advance</button>`:'✔'}</div>`).join('')||'<p class="empty">No complaints yet.</p>'}</div></div>`},
report:()=>`<h2>${t('report')}</h2><div class="card"><label>Type${sel('rt',TYPES)}</label><label>Location<input id="rl" placeholder="Street, ward, landmark"></label><label>Description<textarea id="rd" rows="3"></textarea></label><label>Photo (UI only, not uploaded)<input type="file" accept="image/*"></label><button class="p" onclick="rep()">${t('submit')}</button><div id="out"></div></div>`,
pickup:()=>`<h2>${t('pickup')}</h2><div class="card"><label>Waste type${sel('pt',['Wet','Dry','E-waste','Hazardous','Recyclable'])}</label><label>Quantity${sel('pq',['1-2 kg','5 kg','10 kg','Bulk'])}</label><label>Location<input id="pl"></label><label>Date & time<input id="pw" type="datetime-local"></label><button class="p" onclick="pk()">${t('submit')}</button><div id="out"></div></div>`,
track:()=>`<h2>${t('track')}</h2><input id="q" placeholder="Search complaint ID e.g. C-DEMO1" oninput="fl()"><div id="tl">${cl(D.comps)}</div>`,
wallet:()=>{const bd=[['First Report',D.comps.some(c=>c.by==(D.user||{}).n)],['Eco Starter',D.earned>=50],['Segregation Star',D.day>=7],['Swachh Squad (future)',false]];
return`<h2>${t('wallet')}</h2><span class="tag">Demo points · not money or crypto</span><div class="grid" style="margin-top:10px"><div class="card wal w2"><div class="bal">${D.bal.toLocaleString()}</div><small>SWACHH POINTS</small><div class="wl"><span class="up">+${D.earned} Earned</span><span class="dn">−${D.spent} Redeemed</span></div><div class="chain"><span>Report</span><i>→</i><span>Earn</span><i>→</i><span>Redeem</span><i>→</i><span>Improve community</span></div></div>
<div class="card w2"><h3>Rewards</h3>${REW.map((r,i)=>`<div class="row"><span>${r[0]} · ${r[1]} pts</span><button onclick="rd(${i})">${t('redeem')}</button></div>`).join('')}<div class="row"><span>Donate 10 pts to NGO (demo) · total ${D.ngo}</span><button onclick="dn()">Donate</button></div></div>
${earnCard()}<div class="card"><h3>Badges</h3>${bd.map(b=>`<p>${b[1]?'🏅':'🔒'} ${b[0]}</p>`).join('')}<small>Own: ${D.got.join(', ')||'none'}</small></div>
<div class="card fut"><h3>Refer & Earn</h3><span class="tag">Swachh Squad · Future</span><p>Code: <b>${D.user?D.user.n.slice(0,4).toUpperCase()+'26':'LOGIN'}</b></p><button onclick="D.refs++;save();toast('Demo only: referral not tracked')">Copy code</button></div>
<div class="card"><h3>${t('board')}</h3>${lb().map((x,i)=>`<div class="row"><span>${i+1}. ${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<div class="card w2"><h3>Transactions</h3><div class="ov">${D.tx.map(x=>`<div class="row"><span>${x.d}<br><small>${x.t}</small></span><b class="${x.a>0?'up':'dn'}">${x.a>0?'+':''}${x.a}</b></div>`).join('')||'No transactions yet.'}</div></div></div>`},
rewards:()=>`<h2>${t('rewards')}</h2><span class="tag">Balance: ${D.bal} pts</span><div class="grid" style="margin-top:10px">${REW.map((r,i)=>`<div class="card ${D.bal>=r[1]?'c':''}"><h3>🎁 ${r[0]}</h3><div class="bar"><i style="width:${Math.min(100,D.bal/r[1]*100)}%"></i></div><p>${r[1]} pts</p><button class="p" onclick="rd(${i},'rewards')">${t('redeem')}</button></div>`).join('')}${earnCard()}</div>`,
qrv:()=>`<h2>${t('qrv')}</h2><div class="card"><span class="tag fut">Mock QR · real QR backend: Future</span><label>Check a code<input id="vq" placeholder="QR-P-DEMO1"></label><button class="p" onclick="vq()">Verify</button><div id="out"></div></div><div class="grid" style="margin-top:14px">${D.picks.map(p=>`<div class="card"><b>${p.id}</b> <span class="tag">${p.st}</span><p>${qrSvg(p.qr)}</p><small>${p.qr}<br>${p.hist.map(x=>x.s+' @ '+x.t).join(' → ')}</small></div>`).join('')||'No pickups yet.'}</div>`,
recycle:()=>`<h2>${t('recycle')}</h2><div class="grid">${[['Kanpur Green Hub','Plastic, paper, metal','2.1 km'],['E-Waste Drop Point','Electronics, batteries','4.5 km'],['Glass & Metal Yard','Glass, cans','6.0 km']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p><span class="tag">${x[2]} · mock data</span></div>`).join('')}<div class="card fut"><h3>Live integration</h3><span class="tag">Future</span><p>Real center data and slot booking.</p></div></div>`,
about:()=>`<h2>${t('about')}</h2><div class="grid"><div class="card w2"><h3>Scheme flow (concept)</h3><p><b>Central Govt</b> → funds low-cost scheme → <b>Nagar Nigam</b> runs collection → serves <b>Citizens</b>.<br><b>NGOs</b> join through donations and drives. Nothing here is a real government link.</p></div>
<div class="card c"><h3>Anti-fraud</h3><p>• Unique ID on every complaint and pickup<br>• Timestamp on every status change<br>• QR check before "collected"<br>• Full status history</p></div>
<div class="card w2"><h3>Audit trail</h3><small>ID · created · QR · status history</small><div class="ov" style="max-height:300px;overflow:auto">${[...D.comps.map(c=>[c.id,ST[c.s],'—',c.hist]),...D.picks.map(p=>[p.id,p.st,p.qr,p.hist])].map(x=>`<p><b>${x[0]}</b> <span class="tag">${x[1]}</span> <span class="tag">QR: ${x[2]}</span><br><small>Created ${x[3][0].t}<br>${x[3].map(h=>h.s+' @ '+h.t).join(' → ')}</small></p>`).join('')}</div></div>
<div class="card fut w2"><h3>Future roadmap</h3><p>🔒 Aadhaar integration<br>🔒 Real AI classification<br>🔒 Real QR backend<br>🔒 Recycling-center API<br>🔒 Government / Nagar Nigam integration</p><span class="tag">Not built · placeholders only</span></div></div>`};
function cl(a){return a.map(c=>`<div class="card" style="margin:12px 0"><b>${c.id}</b> <span class="tag">${c.type}</span> <span class="tag ok">${c.s<4?'<i class="live"></i>':'✔ '}${ST[c.s]}</span><p>${c.loc}${c.desc?' — '+c.desc:''}</p>${tlHtml(c.s)}<small>${c.hist.map(h=>h.s+' @ '+h.t).join(' → ')}</small></div>`).join('')||'<p>No complaint found.</p>'}
function fl(){const q=$('#q').value.toUpperCase();$('#tl').innerHTML=cl(D.comps.filter(c=>c.id.includes(q)))}
function rep(){if(!need())return;const l=$('#rl').value.trim();if(!l)return toast('Add a location');
const c={id:uid('C'),type:$('#rt').value,loc:l,desc:$('#rd').value,s:0,by:D.user.n,hist:[{s:'Submitted',t:now()}]};D.comps.unshift(c);save();
$('#out').innerHTML=`<p>Complaint ID: <b>${c.id}</b><br>Status: ${ST[0]}<br><small>Saved ${c.hist[0].t} · +10 pts once verified</small></p><button class="p" onclick="go('track');$('#q').value='${c.id}';fl()">Track status</button>`;$('#rl').value='';$('#rd').value='';toast('Complaint submitted')}
function pk(){if(!need())return;const l=$('#pl').value.trim(),w=$('#pw').value;if(!l||!w)return toast('Add location and time');
const id=uid('P'),p={id,type:$('#pt').value,qty:$('#pq').value,loc:l,when:w.replace('T',' '),st:'Scheduled',qr:'QR-'+id,hist:[{s:'Scheduled',t:now()}],by:D.user.n};D.picks.unshift(p);save();
$('#out').innerHTML=`<p>✅ Confirmed. ID <b>${id}</b><br>Show code <b>${p.qr}</b> to the collector.</p>${qrSvg(p.qr)}`;toast('Pickup booked')}
const SM={Wet:'Wet waste','Dry / Recyclable':'Dry waste',Recyclable:'Dry waste','E-waste':'E-waste',Hazardous:'Hazardous waste'},OC={Wet:'Compostable','Dry / Recyclable':'Recyclable',Recyclable:'Recyclable','E-waste':'Drop-off point',Hazardous:'Special handling'};
function cls(){const f=$('#af').files[0],o=['Banana peel','Newspaper','Old phone','Battery','Glass bottle','Plastic bottle'];const it=f?o[f.name.length%6]:$('#ai_s').value;
const m={'Banana peel':['Wet','Compost or green bin'],'Newspaper':['Dry / Recyclable','Keep dry, blue bin'],'Old phone':['E-waste','Authorised e-waste drop point'],'Battery':['Hazardous','Seal separately, drop at collection point'],'Glass bottle':['Recyclable','Rinse, hand to recycler'],'Plastic bottle':['Recyclable','Rinse, flatten, recycle']}[it];
$('#out').innerHTML=`${f?`<img src="${URL.createObjectURL(f)}" alt="" style="max-width:120px;border:2px solid var(--ink);border-radius:12px">`:''}<div class="flow"><span class="fs">${it}</span><i>↓</i><span class="fs cat">${SM[m[0]]}</span><i>↓</i><span class="fs ok">${OC[m[0]]}</span></div><p>Detected (simulated): <b>${it}</b><br>Confidence: ${80+it.length*7%18}% (fake)<br>Category: <b>${m[0]}</b><br>Disposal: ${m[1]}</p><button onclick="go('report')">Report waste</button> <button onclick="go('pickup')">${t('pickup')}</button>`}
function rd(i,v){if(!need())return;const r=REW[i];if(D.bal<r[1])return toast('Not enough points');add('Redeemed '+r[0],-r[1]);D.got.push(r[0]);save();toast('Redeemed (demo) · points deducted');go(v||'wallet')}
function dn(){if(!need())return;if(D.bal<10)return toast('Not enough points');add('Donation to NGO (demo)',-10);D.ngo+=10;save();go('wallet')}
function jn(){if(!need())return;D.joined=1;save();toast('Joined');go('challenge')}
function ck(){if(D.day>=7)return toast('Challenge complete');D.day++;if(D.day==7){add('Community challenge complete',50);toast('+50 pts added to Wallet')}else toast('Checked in · Day '+D.day+'/7');save();go('challenge')}
function c2(){if(!need()||D.c2)return;D.c2=1;add('Community challenge: Eco Reporter',30);toast('+30 pts added to Wallet');go('challenge')}
function adv(id){const c=D.comps.find(x=>x.id==id);if(c.s>=4)return;c.s++;c.hist.push({s:ST[c.s]+(c.s==2?' → Ramesh (demo collector)':''),t:now()});if(c.s==1&&c.by!='Demo'){add('Verified waste report '+id,10);toast('+10 pts to Wallet')}save();go('admin')}
function qr(id){const p=D.picks.find(x=>x.id==id);if(!p)return;if(p.st!='Scheduled')return toast(id+' already '+p.st);p.st='QR Verified';p.hist.push({s:'QR Verified',t:now()});save();go('collector');$('#qs').textContent='✅ '+id+' QR verified at '+now()+' (simulated)';toast('QR verified')}
function vc(){const c=$('#qc').value.trim().toUpperCase(),p=D.picks.find(x=>x.qr==c);if(!p)return toast('Unknown QR code');qr(p.id)}
function vq(){const c=$('#vq').value.trim().toUpperCase(),p=D.picks.find(x=>x.qr==c);$('#out').innerHTML=p?`<p>ID <b>${p.id}</b> · Status: <b>${p.st}</b><br><small>Last update ${p.hist.slice(-1)[0].t}</small></p>`:'<p>No such code.</p>'}
function mc(id){const p=D.picks.find(x=>x.id==id);if(p.st!='QR Verified')return toast('Verify QR first');p.st='Completed';p.hist.push({s:'Completed',t:now()});add('Completed pickup '+id,20);save();toast('Pickup completed · +20 pts');go('collector')}
function lb(){return[['Aarti',140],['Ravi',95],['Meera',70],[D.user?D.user.n:'You',D.earned]].sort((a,b)=>b[1]-a[1])}
const H={'Balance':'बैलेंस','Earned':'कमाए','Redeemed':'रिडीम','Pending':'लंबित','Resolved':'हल','Total complaints':'कुल शिकायतें','Pickup requests':'पिकअप अनुरोध','Waste categories':'कचरा श्रेणियाँ','Collector activity':'कलेक्टर गतिविधि','Recent complaints':'हाल की शिकायतें','Recent activity':'हाल की गतिविधि','Assigned pickups':'सौंपे गए पिकअप','History':'इतिहास','Transactions':'लेन-देन','Badges':'बैज','Rewards':'रिवॉर्ड','Details':'विवरण','Submitted':'जमा','Verified':'सत्यापित','Assigned':'सौंपा गया','Collector Dispatched':'कलेक्टर रवाना','Scheduled':'निर्धारित','QR Verified':'QR सत्यापित','Completed':'पूर्ण','Type':'प्रकार','Location':'स्थान','Description':'विवरण','Waste type':'कचरे का प्रकार','Quantity':'मात्रा','Date & time':'दिनांक व समय','Classify':'वर्गीकृत करें','Detected (simulated)':'पहचाना (सिमुलेटेड)','Category':'श्रेणी','Disposal':'निस्तारण','Confidence':'विश्वास','Wet':'गीला','Dry':'सूखा','E-waste':'ई-कचरा','Hazardous':'खतरनाक','Recyclable':'रीसाइक्लेबल','Clean city.':'स्वच्छ शहर।','Shared by everyone.':'सबकी साझेदारी।','Password':'पासवर्ड','Name':'नाम','Role':'भूमिका','Register':'रजिस्टर','Login':'लॉगिन','Login / Register':'लॉगिन / रजिस्टर','Aadhaar Login — Future Integration':'आधार लॉगिन — भविष्य में','Advance':'आगे बढ़ाएँ','Donate':'दान','Check in today':'आज चेक-इन करें','Participants':'प्रतिभागी','Reward':'इनाम','Future':'भविष्य','Demo points':'डेमो पॉइंट','Ways to earn':'पॉइंट कमाने के तरीके','Anti-fraud':'धोखाधड़ी-रोधी','Audit trail':'ऑडिट ट्रेल','Future roadmap':'भावी योजना','Complaint ID':'शिकायत ID','Pending scan':'स्कैन लंबित','Verify':'सत्यापित करें','Nothing yet.':'अभी कुछ नहीं।','None yet.':'अभी कोई नहीं।','No pickups.':'कोई पिकअप नहीं।','Eco Reporter':'इको रिपोर्टर','Claim reward':'इनाम पाएँ','Claimed':'प्राप्त','Verified report':'सत्यापित रिपोर्ट','Completed pickup':'पूर्ण पिकअप','Enter code':'कोड दर्ज करें','Check a code':'कोड जाँचें','QR verification':'QR सत्यापन','Requested by':'अनुरोधकर्ता','Created':'निर्मित','Status':'स्थिति','Day':'दिन','Report waste':'कचरा रिपोर्ट करें','7-Day Waste Segregation Challenge':'7-दिवसीय कचरा पृथक्करण चैलेंज','Live integration':'लाइव इंटीग्रेशन','Scheme flow (concept)':'योजना प्रवाह (अवधारणा)','Redeem':'रिडीम','Refer & Earn':'रेफर करें और कमाएँ','Guest':'अतिथि','Dispatched':'रवाना','Total Reports':'कुल रिपोर्ट','Pickups':'पिकअप','Collectors Active':'सक्रिय कलेक्टर','Status overview':'स्थिति अवलोकन','Recent activity':'हाल की गतिविधि','Report it.':'रिपोर्ट करें।','Together, We Keep It Clean':'साथ मिलकर, शहर साफ़ रखें','Community members':'समुदाय सदस्य','Waste collected':'एकत्र कचरा','Challenges completed':'पूर्ण चैलेंज'};
const HR=new RegExp('(^|[^A-Za-z])('+Object.keys(H).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^$()|\[\]\\\/]/g,'\\$&')).join('|')+')(?![A-Za-z])','g');
function tp(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|OPTION|TEXTAREA)$/.test(p.tagName)||p.id=='toast')continue;if(n.__o===undefined)n.__o=n.nodeValue;const v=lang=='hi'?n.__o.replace(HR,(m,a,k)=>a+H[k]):n.__o;if(n.nodeValue!==v)n.nodeValue=v}}
new MutationObserver(tp).observe(document.body,{childList:true,subtree:true});
$('#lp').addEventListener('keydown',e=>{if(e.key=='Enter')auth(1)});addEventListener('keydown',e=>{if(e.key=='Escape')$('#mod').classList.remove('s')});
document.addEventListener('click',e=>{const d=$('.more');if(d&&d.open&&!d.contains(e.target))d.open=false});
go('home');tp();
</script></body></html>
